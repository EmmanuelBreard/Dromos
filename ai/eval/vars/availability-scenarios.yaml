# Availability-focused scenario set for DRO-311/DRO-314 (plan-quality eval harness).
#
# Unlike vars/athletes.yaml (promptfoo string-vars, consumed by the Step 1/2/3
# markdown-pipeline evals), every entry here is a FULL `public.users` row shape —
# same field names/types the DB expects, ready to hand straight to
# `createTestUser(profile)` (ai/eval/lib/eval-supabase-client.js, DRO-311 Step 1).
# No `vars:` wrapper, no stringified numbers, day-lists are real JS arrays.
#
# PRIMARY axis under test: availability feasibility — does plan generation respect
# the athlete's actual time/day constraints? We deliberately do NOT vary
# experience/injury/limiters much; those are covered elsewhere. Each scenario
# crosses one of the two supported race distances (Olympic, Ironman 70.3 — see
# DRO-288) with a distinct availability "shape":
#   - total weekly hours: low / moderate / high
#   - day pattern: few days vs many, weekday-only vs weekend-only vs scattered,
#     and how many rest days (0/NULL-duration days) are seeded
#   - per-day duration caps: even (similar cap every active day) vs
#     short-weekday/long-weekend (crunched on weekdays, long sessions on weekends)
#   - per-sport day eligibility: e.g. pool (swim) available only 1-3 days/week,
#     which is tighter than bike/run eligibility and forces the generator to
#     schedule swim around a narrow window
#
# Rest days: seeded as `0` (not `null`/omitted-key ambiguity) for the *_duration
# fields on days the athlete is unavailable. The Step-1 client
# (createTestUser) translates `0` -> `NULL` before writing, because the DB
# constraint on every `{day}_duration` column is `NULL OR 30..420` (see
# .claude/context/schema.md — a literal 0 would violate the CHECK).
#
# Race dates: this is a static file (no "now" to compute forward from), so
# dates are fixed comfortably in the future (2027) rather than derived —
# Olympic scenarios cluster Feb-Jun 2027, Ironman 70.3 scenarios cluster
# Jun-Oct 2027 (longer runway, matching the longer real-world build a 70.3
# plan needs). If this file is still in use once "today" gets close to these
# dates, refresh them forward — a scenario with a past race_date will make
# generate-plan compute a garbage (zero/negative) total_weeks.

- scenario_name: "olympic-low-4day-weekday-pool2"
  race_objective: "Olympic"
  race_date: "2027-03-14T09:00:00+00:00"
  onboarding_completed: true
  experience_years: 1
  current_weekly_hours: 3
  ftp: 170
  vma: 13.5
  css_seconds_per100m: 135
  # 4 active days, weekday-only, even 60min caps, 3 rest days (Wed/Sat/Sun)
  swim_days: ["Monday", "Thursday"] # pool only 2x/week
  bike_days: ["Tuesday", "Friday"]
  run_days: ["Monday", "Tuesday", "Thursday", "Friday"]
  mon_duration: 60
  tue_duration: 60
  wed_duration: 0
  thu_duration: 60
  fri_duration: 60
  sat_duration: 0
  sun_duration: 0

